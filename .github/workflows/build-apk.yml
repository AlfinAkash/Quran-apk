name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm run build
      - run: rm -rf android && npx cap add android
      - name: Make Android icons from assets/icon-only.png
        run: |
          npm install --no-save sharp
          node <<'EOF'
          const sharp = require('sharp'), fs = require('fs'), path = require('path')
          const res = process.env.RES || 'android/app/src/main/res'
          const src = 'assets/icon-only.png'
          const D = { mdpi: [48, 108], hdpi: [72, 162], xhdpi: [96, 216], xxhdpi: [144, 324], xxxhdpi: [192, 432] }
          const old = /^ic_launcher(_round|_foreground|_background|_fg|_bg)?\.(png|webp|xml)$/
          ;(async () => {
            fs.mkdirSync(res, { recursive: true })
            for (const d of fs.readdirSync(res)) {
              if (!d.startsWith('mipmap')) continue
              for (const f of fs.readdirSync(path.join(res, d))) if (old.test(f)) fs.rmSync(path.join(res, d, f))
            }
            const sq = (n) => sharp(src).resize(n, n, { fit: 'cover' })
            for (const [d, [l, a]] of Object.entries(D)) {
              const dir = path.join(res, 'mipmap-' + d)
              fs.mkdirSync(dir, { recursive: true })
              await sq(l).png().toFile(dir + '/ic_launcher.png')
              const mask = Buffer.from(`<svg xmlns="http://www.w3.org/2000/svg" width="${l}" height="${l}"><circle cx="${l / 2}" cy="${l / 2}" r="${l / 2}"/></svg>`)
              await sq(l).composite([{ input: mask, blend: 'dest-in' }]).png().toFile(dir + '/ic_launcher_round.png')
              await sq(a).png().toFile(dir + '/ic_launcher_fg.png')
              await sharp({ create: { width: a, height: a, channels: 3, background: '#0B2E2A' } }).png().toFile(dir + '/ic_launcher_bg.png')
            }
            const xml = '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@mipmap/ic_launcher_bg"/>\n    <foreground android:drawable="@mipmap/ic_launcher_fg"/>\n</adaptive-icon>\n'
            const any = path.join(res, 'mipmap-anydpi-v26')
            fs.mkdirSync(any, { recursive: true })
            fs.writeFileSync(any + '/ic_launcher.xml', xml)
            fs.writeFileSync(any + '/ic_launcher_round.xml', xml)
            console.log('Icons generated from ' + src)
          })()
          EOF
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Daily-Prayer-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Daily Prayer APK ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
