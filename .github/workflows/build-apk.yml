name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # The Ubuntu runner already includes the Android SDK, so no extra SDK step is needed.
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: node scripts/apply-icons.cjs
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Daily-Prayer-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
